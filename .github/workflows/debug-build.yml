name: Android Debug Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: '37'
  GRADLE_OPTS: "-Dorg.gradle.jvm.toolchain.auto.provisioning=false"

jobs:
  build-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify localized resources (values vs values-pt-rBR)
        run: |
          python3 - <<'PY'
          import re, sys, xml.dom.minidom as M
          def keys(p):
              M.parse(p)
              return dict(re.findall(r'<string name="([^"]+)">(.*?)</string>',
                                     open(p, encoding='utf-8').read(), re.S))
          en = keys('app/src/main/res/values/strings.xml')
          pt = keys('app/src/main/res/values-pt-rBR/strings.xml')
          missing = sorted(set(en) - set(pt))
          extra = sorted(set(pt) - set(en))
          print(f'EN={len(en)} pt-BR={len(pt)}')
          if missing: print('MISSING pt-BR:', missing)
          if extra:   print('EXTRA pt-BR:', extra)
          sys.exit(1 if (missing or extra) else 0)
          PY

      - name: Ensure Android SDK platform ${{ env.ANDROID_API }}
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${ANDROID_API}" > /dev/null 2>&1 || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvm.toolchain.auto.provisioning=false"

      - name: Prepare artifact
        run: |
          ls -lh app/build/outputs/apk/debug/
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.sha256
          cp app-debug.apk SpatialFlow-debug-${GITHUB_SHA::7}.apk
          cp app-debug.sha256 SpatialFlow-debug-${GITHUB_SHA::7}.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpatialFlow-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/SpatialFlow-debug-*.apk
            app/build/outputs/apk/debug/SpatialFlow-debug-*.apk.sha256
          if-no-files-found: error
          retention-days: 14

  checks:
    name: Lint + unit tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvm.toolchain.auto.provisioning=false"

      - name: Run Android lint (debug)
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug --continue
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvm.toolchain.auto.provisioning=false"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
